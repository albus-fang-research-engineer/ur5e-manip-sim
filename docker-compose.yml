# manip-sim: two isolated wings sharing one workspace mount.
#
#   sim         main dev env  (MuJoCo 3.3 + robosuite 1.5)   -> default
#   sim-cpu     same image, forced OSMesa, no GPU reservation
#   libero      Open6DOR V2 wing (robosuite 1.4 + LIBERO)    -> profile "phase3"
#
# Usage:
#   docker compose build sim
#   docker compose run --rm sim python scripts/smoke_test.py
#   docker compose run --rm sim-cpu python scripts/smoke_test.py     # no GPU host
#   docker compose --profile phase3 build libero                     # later
#
# The Jetson/arm64 note: these images are amd64 (nvidia/cuda base). This
# compose file targets the x86 workstation, not the AGX Orin.

services:
  sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: manip-sim:latest
    working_dir: /workspace
    privileged: true
    ipc: host                      # MIT-SHM with the host's Xorg
    devices:                       # DRI3 buffer sharing
      - /dev/dri:/dev/dri
    shm_size: '8gb'                # unrelated, but you'll want it later
    extra_hosts:
      - "grasp:host-gateway"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./:/workspace
      - sim-data:/data
    environment:
      - DISPLAY=${DISPLAY}
      - MUJOCO_GL=egl
      - PYOPENGL_PLATFORM=egl
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ANYGRASP_ADDR=tcp://grasp:5666
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, graphics, display, compute, utility]
    stdin_open: true
    tty: true

  sim-cpu:
    image: manip-sim:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - sim-data:/data
    environment:
      - MUJOCO_GL=osmesa
      - PYOPENGL_PLATFORM=osmesa
    stdin_open: true
    tty: true

  libero:
    profiles: ["phase3"]
    build:
      context: .
      dockerfile: docker/Dockerfile.libero
    image: manip-sim-libero:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - sim-data:/data
    environment:
      - MUJOCO_GL=egl
      - PYOPENGL_PLATFORM=egl
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, graphics, display, compute, utility]
    stdin_open: true
    tty: true
  
  # grasp   AnyGrasp sidecar (ME/torch pins isolated) -> profile "grasp"
  grasp:
    profiles: ["grasp"]
    build:
      context: .
      dockerfile: docker/Dockerfile.anygrasp
    image: manip-grasp:latest
    container_name: AnyGraspServer
    network_mode: host
    privileged: true
    ipc: host
    volumes:
      - ./grasp_server:/opt/grasp_server
      - ./anygrasp_runtime/license:/opt/anygrasp/grasp_detection/license
      - ./anygrasp_runtime/checkpoints:/opt/anygrasp/checkpoints
    environment:
      - GRASP_PORT=5666
      - PYTHONPATH=/opt/anygrasp/grasp_detection 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, graphics, display, compute, utility]
    stdin_open: true
    tty: true

volumes:
  sim-data:
